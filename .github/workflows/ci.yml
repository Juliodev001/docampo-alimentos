name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Testes Unitários (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Rodar testes unitários
        run: npx vitest run --reporter=verbose

  e2e-tests:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        run: npx playwright test
        env:
          # SESSION_SECRET obrigatório para que getSession() funcione (JWT)
          SESSION_SECRET: ci-test-secret-key-minimo-32-chars-aqui
          # DATABASE_URL aponta para host inexistente — os testes E2E só cobrem
          # páginas que redirecionam antes de qualquer query ao banco (getSession
          # retorna null → redirect('/login') sem tocar o Prisma)
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Upload relatório Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
